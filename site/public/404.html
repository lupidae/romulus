<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found – romulus</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<script>
  // Before first paint: the theme the visitor chose here or in the app (same
  // key; without one, tokens.css follows the system), and a flag for the CSS
  // that waits on app.js.
  (function (root) {
    root.classList.add("js");
    try {
      var t = localStorage.getItem("romulus-theme");
      if (t === "light" || t === "dark") root.classList.add(t);
    } catch (e) {}
  })(document.documentElement);
</script>
<link rel="preload" href="/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
