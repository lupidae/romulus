[package]
name = "romulus-cli"
description = "romulus from a terminal or CI: `romulus test` runs a repository's new migrations on rows in a playground and fails the job when one fails, locks dangerously or loses data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "romulus"
path = "src/main.rs"

# Small and standalone: it speaks to romulus over HTTP (the MCP endpoint, with
# a personal access token) and depends on none of the server's crates.
[dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
url.workspace = true

[lints]
workspace = true
