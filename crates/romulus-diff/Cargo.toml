[package]
name = "romulus-diff"
description = "Semantic diff between two remus schema models. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `utoipa::ToSchema` on every output type, so the API can put the diff in its
# OpenAPI document and the SPA gets generated TypeScript types for it.
utoipa = ["dep:utoipa"]

[dependencies]
remus-core.workspace = true
remus-sql.workspace = true
serde.workspace = true
# Not the workspace's utoipa: this crate builds for wasm, so it takes the
# macros only, without the chrono/uuid integrations the API enables.
utoipa = { version = "6.0.0", optional = true, default-features = false, features = ["macros"] }

[dev-dependencies]
remus-core = { workspace = true, features = ["fixtures"] }
insta = "1.49.0"
proptest = "1.12.0"
serde_json.workspace = true
