[package]
name = "romulus-api"
description = "The romulus HTTP API: auth, organizations, databases, versions, drafts and the collab server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
remus-core.workspace = true
remus-dbml.workspace = true
remus-mermaid.workspace = true
remus-sql.workspace = true
romulus-diff = { workspace = true, features = ["utoipa"] }
romulus-migration = { workspace = true, features = ["utoipa"] }
romulus-playground = { workspace = true, features = ["utoipa"] }
romulus-sandbox = { workspace = true, features = ["utoipa"] }

argon2.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
cookie.workspace = true
dotenvy.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
ipnet.workspace = true
lettre.workspace = true
multer.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
# `rc`: compile results are shared, not copied, between the people in a draft.
serde = { workspace = true, features = ["rc"] }
# `raw_value`: the time machine's cached steps keep their values as JSON text.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
similar.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
yrs.workspace = true
zip.workspace = true

[dev-dependencies]
remus-core = { workspace = true, features = ["fixtures"] }
http-body-util.workspace = true
# tests/import_memory.rs: peak heap use, without unsafe code of ours.
peak_alloc = "0.3.0"
rand.workspace = true
rsa.workspace = true
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
