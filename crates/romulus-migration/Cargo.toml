[package]
name = "romulus-migration"
description = "A ready-to-review migration (ALTER … in dependency order) from one remus schema model to another, and its files per migration tool. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `utoipa::ToSchema` on every output type, for the API's OpenAPI document.
utoipa = ["dep:utoipa"]

[dependencies]
remus-core.workspace = true
romulus-diff.workspace = true
serde.workspace = true
# Like romulus-diff: macros only, so the crate still builds for wasm.
utoipa = { version = "6.0.0", optional = true, default-features = false, features = ["macros"] }

[dev-dependencies]
remus-core = { workspace = true, features = ["fixtures"] }
# The oracle: migrations applied in the sandbox Postgres (tests/oracle).
dotenvy.workspace = true
insta = "1.49.0"
romulus-sandbox.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
