[package]
name = "romulus-play-runner"
description = "The playground runner: the only process holding the Docker socket. Fixed operations on playground containers (create, start, stop, snapshot, restore, destroy, quotas); nothing from a request becomes a Docker argument."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["server"]
# The runner itself (the binary): Docker's API and the server. Without it,
# the crate is the protocol and the client the playground service uses.
server = ["dep:axum", "dep:tracing-subscriber", "tokio/signal", "tokio/rt-multi-thread"]

[[bin]]
name = "romulus-play-runner"
required-features = ["server"]

[dependencies]
base64.workspace = true
bytes.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "macros", "fs"] }
tracing.workspace = true
uuid.workspace = true

axum = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
