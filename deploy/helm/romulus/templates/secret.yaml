{{- include "romulus.validate" . -}}
{{- $fullname := include "romulus.fullname" . -}}
{{- if .Values.existingSecret }}
{{- /* Checked when the cluster can say (lookup is empty in `helm template`). */}}
{{- $given := lookup "v1" "Secret" .Release.Namespace .Values.existingSecret }}
{{- if $given }}
{{- range $key := list "postgres-password" "sandbox-password" }}
{{- $value := get ($given.data | default dict) $key }}
{{- if not $value }}
{{- fail (printf "existingSecret %s has no %s" $.Values.existingSecret $key) }}
{{- end }}
{{- include "romulus.checkPassword" (dict "value" (b64dec $value) "what" (printf "%s in existingSecret %s" $key $.Values.existingSecret) "min" 16) }}
{{- end }}
{{- end }}
{{- else }}
{{- /* Generated once, then read back from the cluster on every upgrade:
       never replaced (install.sh's rule for .env). Kept when the release is
       uninstalled, like the volumes its passwords open. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data | default dict }}
{{- else }}
{{- /* Volumes outlive the Secret: new passwords would lock the app out of
       its own data (install.sh refuses the same way when .env is gone). */}}
{{- $claims := list (printf "data-%s-0" (include "romulus.postgresqlName" .)) }}
{{- range splitList "," (include "romulus.majors" .) }}
{{- $claims = append $claims (printf "data-%s-0" (include "romulus.sandboxName" (dict "root" $ "major" .))) }}
{{- end }}
{{- range $claims }}
{{- if lookup "v1" "PersistentVolumeClaim" $.Release.Namespace . }}
{{- fail (printf "the volume %s exists but the Secret %s is gone: put the Secret back from your backups (its passwords open that data), or, to start over, delete the release's volumes first (the dumps stay): kubectl -n %s delete pvc -l app.kubernetes.io/instance=%s,app.kubernetes.io/component!=backup" . $fullname $.Release.Namespace $.Release.Name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "romulus.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ get $data "postgres-password" | default (randAlphaNum 64 | b64enc) }}
  sandbox-password: {{ get $data "sandbox-password" | default (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- if include "romulus.hasEnvSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "romulus.envSecretName" . }}
  labels:
    {{- include "romulus.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "romulus.envSecretData" . | nindent 2 }}
{{- end }}
