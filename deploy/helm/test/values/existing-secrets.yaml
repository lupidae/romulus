# Everything secret from Secrets you made: the sandbox password, the
# external database's whole URL, mail and single sign-on.
host: romulus.example.com
existingSecret: romulus-secrets
auth:
  methods: password, oidc
  oidc:
    issuer: https://id.example.com
    clientId: romulus
    existingSecret: romulus-oidc
smtp:
  host: smtp.example.com
  username: apikey
  existingSecret: romulus-smtp
  from: romulus@example.com
postgresql:
  external:
    enabled: true
    existingSecret: romulus-db
    existingSecretUrlKey: uri
backup:
  persistence:
    existingClaim: romulus-dumps
