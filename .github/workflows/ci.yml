name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

# A newer push supersedes a PR's run; main keeps every run, one per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with `nightly` in the justfile and the version in CLAUDE.md.
  RUSTFMT_NIGHTLY: nightly-2026-10-14
  SQLX_CLI_VERSION: 0.9.0

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: romulus
          POSTGRES_PASSWORD: romulus
          POSTGRES_DB: romulus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U romulus -d romulus"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The query macros check against this database, and #[sqlx::test]
      # creates its throwaway databases on the same server.
      DATABASE_URL: postgres://romulus:romulus@localhost:5432/romulus
      # romulus-sandbox's integration tests compile against it (started below:
      # a service cannot build an image).
      ROMULUS_SANDBOX_URL: postgres://sandbox_admin:sandbox_admin@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins stable; rustfmt.toml needs nightly rustfmt.
      - run: rustup toolchain install
      - run: rustup toolchain install "$RUSTFMT_NIGHTLY" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install sqlx-cli
        run: |
          cargo sqlx --version 2>/dev/null | grep -qF "$SQLX_CLI_VERSION" ||
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features postgres,rustls

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Start the sandbox Postgres
        run: |
          docker build -t romulus-sandbox deploy/sandbox
          # The memory settings of docker-compose.yml (deploy/sandbox/README.md).
          docker run -d --name sandbox -p 5433:5432 \
            --memory 768m --oom-score-adj -1000 \
            -e PG_OOM_ADJUST_FILE=/proc/self/oom_score_adj -e PG_OOM_ADJUST_VALUE=1000 \
            -e POSTGRES_USER=sandbox_admin -e POSTGRES_PASSWORD=sandbox_admin -e POSTGRES_DB=postgres \
            romulus-sandbox postgres -c synchronous_commit=off -c wal_level=minimal -c max_wal_senders=0 \
            -c shared_buffers=32MB -c max_connections=60 -c max_locks_per_transaction=2048
          for _ in $(seq 60); do docker exec sandbox pg_isready -U sandbox_admin -d postgres && exit 0; sleep 1; done
          docker logs sandbox; exit 1

      - run: cargo sqlx migrate run --source migrations
      - run: just check

  # The other Postgres majors a database can target (docs/MVP.md, "Several
  # Postgres majors"); `just check` covers the default one (17) whole. Per
  # major: the sandbox compiles the corpus (romulus-sandbox's `majors`
  # tests), and the migration oracle proves the migrations planned for it,
  # as a smoke subset (the scenarios whole; ROMULUS_ORACLE_FULL=1 for all).
  majors:
    name: Postgres ${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [15, 16, 18]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start the Postgres ${{ matrix.major }} sandbox
        run: |
          docker build --build-arg PG_MAJOR=${{ matrix.major }} -t romulus-sandbox deploy/sandbox
          docker run -d --name sandbox -p 5433:5432 \
            --memory 768m --oom-score-adj -1000 \
            -e PG_OOM_ADJUST_FILE=/proc/self/oom_score_adj -e PG_OOM_ADJUST_VALUE=1000 \
            -e POSTGRES_USER=sandbox_admin -e POSTGRES_PASSWORD=sandbox_admin -e POSTGRES_DB=postgres \
            romulus-sandbox postgres -c synchronous_commit=off -c wal_level=minimal -c max_wal_senders=0 \
            -c shared_buffers=32MB -c max_connections=60 -c max_locks_per_transaction=2048
          for _ in $(seq 60); do docker exec sandbox pg_isready -U sandbox_admin -d postgres && exit 0; sleep 1; done
          docker logs sandbox; exit 1
      # (An env key cannot hold an expression: the variable is set in the script.)
      - name: The corpus compiles on Postgres ${{ matrix.major }}
        run: |
          export ROMULUS_SANDBOX_URL_PG${{ matrix.major }}=postgres://sandbox_admin:sandbox_admin@localhost:5433/postgres
          cargo test -p romulus-sandbox --test sandbox majors
      - name: The migration oracle on Postgres ${{ matrix.major }} (smoke subset)
        run: cargo test -p romulus-migration --test oracle
        env:
          ROMULUS_SANDBOX_URL: postgres://sandbox_admin:sandbox_admin@localhost:5433/postgres

  e2e:
    name: end-to-end
    # Manual for now: it boots the whole stack, Zitadel included.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: just up
      # A database on Postgres 15 (e2e/postgres-majors.spec.ts).
      - run: just sandbox 15
      - run: scripts/check-oidc
      - run: just e2e
        env:
          SQLX_OFFLINE: "true"
      # The dev-only screens (graph editing, groups, the viewer on fixtures):
      # the Vite dev server, no API.
      - run: just e2e-dev
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
