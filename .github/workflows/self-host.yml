name: Self-host

# The self-host bundle end to end (deploy/self-host/test/install-test.sh):
# install.sh --non-interactive against images built here, then install
# again, backup, restore, upgrade and uninstall. Nothing is pushed: the
# images are loaded into this runner's Docker as local/romulus-api:test and
# local/romulus-sandbox:test (ROMULUS_REGISTRY=local, ROMULUS_VERSION=test).
on:
  pull_request:
    paths:
      - "deploy/self-host/**"
      - "Dockerfile"
      - "migrations/**"
      - "crates/romulus-api/**"
      - ".github/workflows/self-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install.sh end to end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Lint the scripts
        run: |
          docker run --rm -v "$PWD/deploy/self-host:/mnt:ro" koalaman/shellcheck:stable \
            -x /mnt/install.sh /mnt/backup.sh /mnt/test/install-test.sh /mnt/test/stub/romulus-api

      - uses: docker/setup-buildx-action@v4

      # The same Dockerfiles and cache scopes as the Images workflow, so a
      # pull request that built its images there builds nothing here.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/romulus-api:test
          cache-from: type=gha,scope=romulus-api
          cache-to: type=gha,mode=max,scope=romulus-api

      - name: Build the sandbox image (Postgres 17)
        uses: docker/build-push-action@v7
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/romulus-sandbox:test
          build-args: PG_MAJOR=17
          cache-from: type=gha,scope=romulus-sandbox
          cache-to: type=gha,mode=max,scope=romulus-sandbox

      - name: Install, re-install, backup, restore, upgrade, uninstall
        env:
          ROMULUS_REGISTRY: local
          ROMULUS_VERSION: test
        run: deploy/self-host/test/install-test.sh
