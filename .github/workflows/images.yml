name: Images

# The official romulus images, published to ghcr.io/lupidae by the
# maintainers (run on a fork, this pushes to ghcr.io/<the fork's owner>; a
# fork's pull request pushes nothing). Each package's visibility is set on
# GitHub, apart from the repository's. The images:
#   romulus-api        Dockerfile: the API, serving the web app at /app
#   romulus-sandbox     deploy/sandbox: the Postgres SQL compiles run in, once
#                       per Postgres major a database can target (PG_MAJOR):
#                       17, the default, under the bare tags; 15, 16 and 18
#                       under `<tag>-pg<major>`
#   romulus-play        Dockerfile, target play: the playground runner and service
#   romulus-playground  deploy/playground: a playground's Postgres (17)
# Each is tagged with the full sha of the commit it was built from, and
# `main` on main. A pull request from this repository pushes its head's sha
# as well, so a branch can be deployed to the preview before it merges
# (deploy/preview/README.md); `main` only ever moves with main.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    name: ${{ matrix.name }}${{ matrix.suffix }}
    # A fork's pull request gets a read-only token: it could not push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: romulus-api
            context: .
            file: Dockerfile
          - name: romulus-sandbox
            context: deploy/sandbox
            file: deploy/sandbox/Dockerfile
            build-args: PG_MAJOR=17
          - name: romulus-sandbox
            suffix: -pg15
            context: deploy/sandbox
            file: deploy/sandbox/Dockerfile
            build-args: PG_MAJOR=15
          - name: romulus-sandbox
            suffix: -pg16
            context: deploy/sandbox
            file: deploy/sandbox/Dockerfile
            build-args: PG_MAJOR=16
          - name: romulus-sandbox
            suffix: -pg18
            context: deploy/sandbox
            file: deploy/sandbox/Dockerfile
            build-args: PG_MAJOR=18
          - name: romulus-play
            context: .
            file: Dockerfile
            target: play
          - name: romulus-playground
            context: deploy/playground
            file: deploy/playground/Dockerfile
    steps:
      # A pull request's own head, not the merge commit GitHub makes: the tag
      # must name a commit that exists on the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          suffix="${{ matrix.suffix }}"
          sha=$(git rev-parse HEAD)
          tags="$image:$sha$suffix"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags,$image:main$suffix"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.build-args }}
          # The source label links the package to this repository, so it
          # inherits the repository's access (deploy pulls with a read:packages PAT).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.suffix }}

      - name: Summary
        run: echo "Pushed \`${{ steps.tags.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
