[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/lupidae/romulus"
rust-version = "1.99"
publish = false

[workspace.dependencies]
remus-core = "0.2.0"
remus-sql = "0.2.0"
remus-dbml = "0.2.0"
remus-mermaid = "0.2.0"
romulus-diff = { path = "crates/romulus-diff" }
romulus-fakedata = { path = "crates/romulus-fakedata" }
romulus-migration = { path = "crates/romulus-migration" }
romulus-migration-check = { path = "crates/romulus-migration-check" }
romulus-play-runner = { path = "crates/romulus-play-runner", default-features = false }
romulus-playground = { path = "crates/romulus-playground", default-features = false }
romulus-sandbox = { path = "crates/romulus-sandbox" }

# Password accounts (ROMULUS_AUTH=password): Argon2id PHC strings.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
# Playground passwords and the API → playground service signatures.
hmac = "0.12.1"
http-body-util = "0.1.5"
# HTTP over Unix sockets: the runner (Docker's API) and the service (the runner's).
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# The common-password list (auth::password::policy), gzipped: already built
# for zip's deflate.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
# ROMULUS_TRUSTED_PROXIES: CIDR ranges.
ipnet = "2.12.2"
# Email over SMTP (sign-up links, password resets, invitations): rustls with
# webpki roots and ring, like every other TLS client here.
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }
# multipart/form-data bodies: migration folders uploaded from the browser.
multer = "3.1.0"
openidconnect = "4.0.1"
# The playground service's own Postgres client (console sessions: every value
# as Postgres's text, notices, transaction state, cancel, COPY).
postgres-protocol = "0.6.12"
# Tests only: the fake IdP signs ID tokens with a key made at test time.
rand = "0.8.5"
# The API calling the playground service (signed, on the private link).
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# Minimal text edits: the server rewriting a draft's SQL (collab::patch).
similar = "2.7.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "ipnet",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
] }
thiserror = "2.0.21"
# Tests only: a websocket client for the collab server.
tokio-tungstenite = "0.29.0"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "fs", "limit", "request-id", "timeout", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }
# Yjs in Rust: the collab server's documents and the y-sync protocol.
yrs = { version = "0.28.0", features = ["sync"] }
# Zipped migration folders (imports). Deflate only, in pure Rust.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic, but noise for a web service: every handler returns Result, and
# naming a type after its module (orgs::OrgsError) reads fine at the call site.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Restriction lints that catch leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package.sqlx-macros]
# The query macros run on every build; an optimised build of them pays off fast.
opt-level = 3

# Password hashing (Argon2id, 19 MiB): seconds per hash unoptimised, which
# every password test would pay.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# The API tests' fake IdP generates an RSA key: seconds unoptimised, instant here.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The homepage's wasm (crates/romulus-wasm, site/tools/hero.mjs): small over
# fast, and nothing else is built with it.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
