[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Private repository, no license granted (see the owner before changing).
license = "UNLICENSED"
repository = "https://github.com/lupidae/romulus"
rust-version = "1.99"
publish = false

[workspace.dependencies]
remus-core = "0.2.0"
remus-sql = "0.2.0"
remus-dbml = "0.2.0"
remus-mermaid = "0.2.0"
romulus-diff = { path = "crates/romulus-diff" }
romulus-sandbox = { path = "crates/romulus-sandbox" }

axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
openidconnect = "4.0.1"
# Tests only: the fake IdP signs ID tokens with a key made at test time.
rand = "0.8.5"
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
] }
thiserror = "2.0.21"
# Tests only: a websocket client for the collab server.
tokio-tungstenite = "0.29.0"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "timeout", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }
# Yjs in Rust: the collab server's documents and the y-sync protocol.
yrs = { version = "0.28.0", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic, but noise for a web service: every handler returns Result, and
# naming a type after its module (orgs::OrgsError) reads fine at the call site.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Restriction lints that catch leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package.sqlx-macros]
# The query macros run on every build; an optimised build of them pays off fast.
opt-level = 3

# The API tests' fake IdP generates an RSA key: seconds unoptimised, instant here.
[profile.dev.package.num-bigint-dig]
opt-level = 3
